name: Docker publish (multi-arch)

# Builds and pushes amenzb/loon-agent:latest as a multi-arch
# manifest (linux/amd64 + linux/arm64) on every push to main, plus
# on manual dispatch. Solves the long-standing "no ARM image"
# problem for Raspberry Pi / Apple Silicon / AWS Graviton operators
# who can't pull amenzb/loon-agent:latest on their host.
#
# Required repo secrets:
#   DOCKERHUB_USERNAME  — your Docker Hub login (e.g. amenzb)
#   DOCKERHUB_TOKEN     — Docker Hub access token (Settings -> Security)
#
# Both are created at https://hub.docker.com/settings/security and
# added at https://github.com/<org>/<repo>/settings/secrets/actions.
# Until both secrets exist the workflow exits with a clear "missing
# credentials" failure rather than half-pushing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs of the same branch when a new commit lands;
# we only ever want the latest commit's image as :latest.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN:    ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is missing."
            echo "Add them at Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      # QEMU lets the amd64 GitHub runner emit arm64 layers; without
      # it the arm64 build silently builds for amd64 with wrong
      # binaries inside.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: amenzb/loon-agent:latest
          # GitHub Actions registry cache keeps the layer cache
          # cross-job so consecutive pushes only rebuild what
          # actually changed instead of compiling Go from scratch
          # for both arches every time.
          cache-from: type=gha
          cache-to:   type=gha,mode=max
