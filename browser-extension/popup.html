<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body {
    width: 320px; margin: 0; padding: 12px 14px;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #16181e; color: #e2e4ec;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  label { display: block; font-size: 11px; color: #6b7485; margin: 8px 0 2px; }
  input, textarea {
    width: 100%; box-sizing: border-box; padding: 6px 8px;
    background: #1c1f27; border: 1px solid #2a2d37; border-radius: 6px;
    color: #e2e4ec; font: inherit; font-size: 12px;
  }
  textarea { resize: vertical; min-height: 52px; font-family: ui-monospace, monospace; }
  input:focus, textarea:focus { outline: none; border-color: #5b8af5; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button {
    flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid #2a2d37;
    background: #1c1f27; color: #e2e4ec; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary { background: #5b8af5; border-color: #5b8af5; color: #fff; }
  button:hover { border-color: #5b8af5; }
  .hint { font-size: 11px; color: #6b7485; margin-top: 2px; }
  #status { margin-top: 10px; font-size: 12px; }
  .ok { color: #22c55e; } .bad { color: #f87171; } .muted { color: #6b7485; }
  .line { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .clip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  code { font-family: ui-monospace, monospace; }
  hr { border: none; border-top: 1px solid #2a2d37; margin: 14px 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: #6b7485; margin: 8px 0 2px; }
  .riplist { margin-top: 6px; max-height: 180px; overflow-y: auto; }
  .riprow { font-family: ui-monospace, monospace; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #22252e; }
</style>
</head>
<body>
  <h1>loon cookie bridge</h1>

  <label for="siteUrl">Site URL</label>
  <input id="siteUrl" placeholder="https://amenzb.moe" autocomplete="off">

  <label for="apiKey">Your API key</label>
  <input id="apiKey" type="password" placeholder="from Account Settings" autocomplete="off">
  <div class="hint">Account Settings &rarr; API. Same key your *arr apps use.</div>

  <label for="domains">Tracker domains (one per line)</label>
  <textarea id="domains" placeholder="animetorrents.me&#10;nyaa.si"></textarea>
  <div class="hint">Log in to each in this browser first. Only these domains are read.</div>

  <label for="interval">Sync every (minutes)</label>
  <input id="interval" type="number" min="5" value="30">

  <div class="row">
    <button id="save">Save</button>
    <button id="sync" class="primary">Sync now</button>
  </div>

  <div id="status" class="muted">Loading…</div>

  <hr>
  <h2>Rip this page</h2>
  <div class="hint">Reads the release list off the tracker page in the active tab, and shows the ones you haven't seen before.</div>
  <div class="row">
    <button id="rip" class="primary">Rip current page</button>
    <button id="ripforget">Reset seen</button>
  </div>
  <div id="ripstatus" class="muted" style="margin-top:8px;"></div>
  <div id="riplist" class="riplist"></div>

  <script src="popup.js"></script>
</body>
</html>
